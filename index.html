<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>建設FAX Excel AI デモ</title>
    <link rel="stylesheet" href="public/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <span class="mark">FX</span>
          <div>
            <h1>建設FAX Excel AI</h1>
            <p>FAX・PDF・写真を読み取り、Excel入力用の項目に整理します</p>
          </div>
        </div>
        <div class="status-pill" id="status">サンプルで画面の流れを確認できます</div>
      </header>

      <section class="workflow" aria-label="処理の流れ">
        <div class="step active"><span>1</span> 読み込み</div>
        <div class="step"><span>2</span> 抽出</div>
        <div class="step"><span>3</span> 確認</div>
        <div class="step"><span>4</span> Excel出力</div>
      </section>

      <section class="workspace">
        <aside class="input-pane">
          <div class="section-heading">
            <h2>原本データ</h2>
            <p>GitHub Pages版では、サンプルとテキスト貼り付けを試せます</p>
          </div>

          <label class="drop-zone" for="fileInput">
            <input id="fileInput" type="file" accept=".txt,.csv,.log" />
            <strong>テキストを選択</strong>
            <span>OCR済みテキスト</span>
          </label>

          <div class="action-grid">
            <button id="sampleBtn" type="button">サンプル読込</button>
            <button id="extractBtn" type="button" class="primary">抽出する</button>
          </div>

          <button id="autoRunBtn" type="button" class="secondary">受信FAXフォルダ処理はローカル版で利用</button>

          <textarea id="faxText" spellcheck="false" placeholder="FAXのOCR結果、または受信内容を貼り付けます"></textarea>
        </aside>

        <section class="result-pane">
          <div class="toolbar">
            <div class="section-heading">
              <h2>確認・修正</h2>
              <p>読み取り結果を確認して、必要な箇所だけ修正できます</p>
            </div>
            <button id="exportBtn" type="button" disabled>Excel出力</button>
          </div>

          <div class="summary-grid" id="headerFields"></div>

          <div class="table-header">
            <div>
              <h3>資材明細</h3>
              <p>数量、単価、金額はExcel出力前に確認してください</p>
            </div>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>品番</th>
                  <th>商品名・資材名</th>
                  <th>数量</th>
                  <th>単位</th>
                  <th>単価</th>
                  <th>金額</th>
                </tr>
              </thead>
              <tbody id="itemRows"></tbody>
            </table>
          </div>

          <div class="download" id="download"></div>
        </section>
      </section>
    </main>

    <script>
      const labels = {
        received_date: "受信日",
        document_type: "書類種別",
        sender_company: "送信元会社",
        recipient_company: "宛先会社",
        fax_no: "FAX番号",
        order_no: "注文番号",
        project_name: "工事名",
        site_name: "現場名",
        delivery_place: "納入場所",
        delivery_date: "納期",
        desired_time: "希望時間",
        person_in_charge: "担当者",
        notes: "備考",
      };
      const itemKeys = ["item_code", "item_name", "quantity", "unit", "unit_price", "amount"];
      const sampleText = `資材発注書
日付: 2026/05/29
送信元: 株式会社青葉建設
宛先: 株式会社東都資材 御中
FAX: 03-1234-5678
注文番号: AOB-20260529-018
工事名: 日本橋第3ビル改修工事
現場名: 日本橋三丁目作業所
納入場所: 東京都中央区日本橋3-1-1 北側搬入口
担当者: 佐藤
納期: 2026/06/05
希望時間: 8:00-10:00

品番 商品名 数量 単位 単価 金額
RC-2525 普通ポルトランドセメント 20 袋 780 15600
RB-0013 異形鉄筋 D13 80 本 510 40800
CN-0045 コンクリート釘 10 箱 920 9200

備考: 搬入前に現場担当へ電話してください。`;
      let current = { header: {}, items: [], confidence: {}, raw_text: "" };
      const faxText = document.querySelector("#faxText");
      const headerFields = document.querySelector("#headerFields");
      const itemRows = document.querySelector("#itemRows");
      const status = document.querySelector("#status");
      const exportBtn = document.querySelector("#exportBtn");
      const download = document.querySelector("#download");

      function setStatus(text, type = "neutral") {
        status.textContent = text;
        status.dataset.type = type;
      }
      function first(patterns, text) {
        for (const pattern of patterns) {
          const match = text.match(pattern);
          if (match) return match[1].trim();
        }
        return "";
      }
      function date(value) {
        const match = (value || "").match(/(\d{4})[./年-](\d{1,2})[./月-](\d{1,2})/);
        return match ? `${match[1]}-${String(Number(match[2])).padStart(2, "0")}-${String(Number(match[3])).padStart(2, "0")}` : value;
      }
      function number(value) {
        const parsed = Number(String(value || "").replace(/[^0-9.-]/g, ""));
        return Number.isFinite(parsed) ? parsed : "";
      }
      function extractLocal(text) {
        const header = {
          received_date: date(first([/(?:受信日|日付|発注日)[:： ]*([0-9./年月日-]+)/], text)),
          document_type: first([/(見積依頼書|発注書|注文書|納品依頼書|資材依頼書|作業依頼書)/], text),
          sender_company: first([/(?:送信元|差出人|発注元)[:： ]*(.+)/], text),
          recipient_company: first([/(?:宛先|納入先)[:： ]*(.+)/], text),
          fax_no: first([/(?:FAX|Fax)[:： ]*([0-9\-() ]{8,})/], text),
          order_no: first([/(?:注文番号|発注番号|注文No\.?)[:： ]*([A-Z0-9-]+)/i], text),
          project_name: first([/(?:工事名|案件名|件名)[:： ]*(.+)/], text),
          site_name: first([/(?:現場名|現場)[:： ]*(.+)/], text),
          delivery_place: first([/(?:納入場所|搬入場所|納品場所|現場住所|住所)[:： ]*(.+)/], text),
          delivery_date: date(first([/(?:納期|希望納期|納入日|搬入日|納品日)[:： ]*([0-9./年月日-]+)/], text)),
          desired_time: first([/(?:希望時間|搬入時間|納品時間|時間指定)[:： ]*(.+)/], text),
          person_in_charge: first([/(?:担当者|担当)[:： ]*(.+)/], text),
          notes: first([/(?:備考|摘要|連絡事項)[:： ]*(.+)/], text),
        };
        const itemPattern = /^([A-Z0-9][A-Z0-9-]{2,})\s+(.+?)\s+(\d+(?:\.\d+)?)\s*(個|枚|箱|本|台|kg|t|式|袋|缶|束|セット|m|ｍ|m2|m3|㎡|㎥)?\s+([\d,]+)?\s+([\d,]+)?$/i;
        const items = text.split("\n").map((line) => line.trim()).map((line) => line.match(itemPattern)).filter(Boolean).map((match) => {
          const qty = number(match[3]);
          const price = number(match[5]);
          const amount = number(match[6]) || (qty && price ? qty * price : "");
          return { item_code: match[1], item_name: match[2], quantity: qty, unit: match[4] || "個", unit_price: price, amount };
        });
        return {
          header,
          items: items.length ? items : [{ item_code: "", item_name: "", quantity: "", unit: "", unit_price: "", amount: "" }],
          confidence: Object.fromEntries(Object.entries(header).map(([key, value]) => [key, value ? 0.92 : 0.35])),
          raw_text: text,
        };
      }
      function renderHeader() {
        headerFields.innerHTML = "";
        for (const [key, label] of Object.entries(labels)) {
          const wrapper = document.createElement("div");
          wrapper.className = `field ${(current.confidence[key] || 0) < 0.7 ? "low" : ""}`;
          const fieldLabel = document.createElement("label");
          fieldLabel.textContent = label;
          const input = document.createElement("input");
          input.value = current.header[key] || "";
          input.addEventListener("input", () => { current.header[key] = input.value; });
          wrapper.append(fieldLabel, input);
          headerFields.append(wrapper);
        }
      }
      function renderItems() {
        itemRows.innerHTML = "";
        current.items.forEach((item, index) => {
          const row = document.createElement("tr");
          itemKeys.forEach((key) => {
            const cell = document.createElement("td");
            const input = document.createElement("input");
            input.value = item[key] ?? "";
            input.addEventListener("input", () => { current.items[index][key] = input.value; });
            cell.append(input);
            row.append(cell);
          });
          itemRows.append(row);
        });
      }
      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
      }
      document.querySelector("#sampleBtn").addEventListener("click", () => {
        faxText.value = sampleText;
        setStatus("サンプルを読み込みました", "success");
      });
      document.querySelector("#extractBtn").addEventListener("click", () => {
        if (!faxText.value.trim()) return setStatus("原本データを入力してください", "warning");
        current = extractLocal(faxText.value.trim());
        renderHeader();
        renderItems();
        exportBtn.disabled = false;
        setStatus("確認して、必要な箇所だけ修正できます", "success");
      });
      exportBtn.addEventListener("click", () => {
        const rows = Object.entries(labels).map(([key, label]) => `<tr><th>${label}</th><td>${escapeHtml(current.header[key])}</td></tr>`).join("");
        const items = current.items.map((item) => `<tr>${itemKeys.map((key) => `<td>${escapeHtml(item[key])}</td>`).join("")}</tr>`).join("");
        const html = `<html><head><meta charset="utf-8"></head><body><table border="1"><tr><th colspan="6">建設FAX自動入力 結果</th></tr>${rows}<tr></tr><tr><th>品番</th><th>商品名</th><th>数量</th><th>単位</th><th>単価</th><th>金額</th></tr>${items}</table></body></html>`;
        const url = URL.createObjectURL(new Blob([html], { type: "application/vnd.ms-excel;charset=utf-8" }));
        const link = document.createElement("a");
        link.href = url;
        link.download = "fax_excel_demo.xls";
        link.click();
        URL.revokeObjectURL(url);
        setStatus("Excel出力が完了しました", "success");
      });
      document.querySelector("#autoRunBtn").addEventListener("click", () => setStatus("受信FAXフォルダ処理はローカル版で利用できます", "neutral"));
      document.querySelector("#fileInput").addEventListener("change", async (event) => {
        const [file] = event.target.files;
        if (!file) return;
        faxText.value = await file.text();
        setStatus(`${file.name} を読み込みました`, "success");
      });
      renderHeader();
      renderItems();
    </script>
  </body>
</html>
